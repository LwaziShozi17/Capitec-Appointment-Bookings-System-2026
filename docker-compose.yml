services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capitec_booking
      POSTGRES_USER: ${POSTGRES_USER:-capitec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capitec123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capitec -d capitec_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/capitec_booking
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-capitec}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-capitec123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-at-least-256-bits}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
